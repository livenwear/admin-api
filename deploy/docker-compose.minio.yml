# Explicit project name — must NEVER share Compose project "deploy" with Sumer
# (both live under .../deploy/docker-compose.minio.yml on the same VPS).
name: liven-minio

services:
  minio:
    image: minio/minio:latest
    container_name: liven-minio
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - /opt/liven-data/minio:/data
