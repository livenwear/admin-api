# Liven MinIO only — must not touch Sumer MinIO on the same VPS.
#
# Isolation:
#   - container_name: liven-minio  (Sumer uses a different name)
#   - host ports 9010/9011        (Sumer typically 9000/9001)
#   - data dir: /opt/liven-data/minio
#   - compose project: always started with `-p liven-minio` (see deploy-vps.sh)
#
# Do NOT add top-level `name:` — older `docker-compose` v1 on the VPS rejects it
# with: 'name' does not match any of the regexes: '^x-'

version: "3.3"

services:
  minio:
    image: minio/minio:latest
    container_name: liven-minio
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Public S3 hostname behind nginx — keeps server-side URL generation aligned
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-https://cdn.livenmode.ir}
    command: server /data --console-address ":9001"
    volumes:
      - /opt/liven-data/minio:/data
